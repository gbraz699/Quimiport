services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: quimiport
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    expose:
      - "5432"
    volumes:
      - quimiport_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quimiport"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/quimiport
      PORT: "3000"
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  quimiport_pgdata:
